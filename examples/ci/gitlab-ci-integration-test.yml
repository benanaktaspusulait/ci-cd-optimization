# GitLab CI integration test stage — Testcontainers mode for FDP
#
# This replaces the docker-compose-maven-plugin approach in CI.
# Instead of Maven starting docker-compose, Testcontainers manages infrastructure
# programmatically from within the test JVM.
#
# Current CI approach (docker-compose-maven-plugin):
#   1. Maven pre-integration-test: docker-compose up (zookeeper, kafka, redis, schema-registry)
#   2. Wait container checks health
#   3. Aggregators start
#   4. Command adaptor builds + starts
#   5. Cucumber tests run (mvn verify -P ci-cmd)
#   6. Maven post-integration-test: docker-compose down
#
# Proposed CI approach (Testcontainers):
#   1. Maven verify -P testcontainers (docker-compose-maven-plugin skipped)
#   2. Testcontainers starts kafka + redis + schema-registry inside test JVM
#   3. @DynamicPropertySource wires dynamic ports
#   4. Cucumber tests run (same features, same steps)
#   5. Containers are cleaned by Ryuk in this GitLab example.
#      Drone may require Ryuk to be disabled; see drone-considerations.md.
#
# Prerequisites:
#   - Runner with Docker access (DinD or socket mount) — see ADR-0005
#   - quay.io/ukhomeofficedigital/ileap-java17-mvn:1.3 (existing FDP CI image)
#
# Reference: ADR-0002, ADR-0005, Story 4, T4.2

# ─── Integration test with Testcontainers ────────────────────────────────────
integration-test-testcontainers:
  stage: integration-test
  image: quay.io/ukhomeofficedigital/ileap-java17-mvn:1.3
  tags:
    - docker-privileged   # TODO: confirm with platform/ETO (ADR-0005)
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  cache:
    key: "$CI_COMMIT_REF_SLUG-maven"
    paths:
      - .m2/repository
  before_script:
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
    - docker info
  script:
    - ITEST_START=$(date +%s)
    # Run integration tests with Testcontainers profile (skips docker-compose-maven-plugin)
    - ./mvnw -B verify -pl cmd-adaptor-dvla-integration-tests -P testcontainers
    - ITEST_END=$(date +%s)
    - echo "Integration test duration $(( ITEST_END - ITEST_START ))s" | tee itest-testcontainers-metrics.txt
  artifacts:
    reports:
      junit: cmd-adaptor-dvla-integration-tests/target/failsafe-reports/TEST-*.xml
    paths:
      - itest-testcontainers-metrics.txt
      - cmd-adaptor-dvla-integration-tests/target/cucumber-report.json
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ─── Integration test with Docker Compose (current/fallback) ─────────────────
# Kept as fallback until T4.2 confirms Testcontainers works reliably in CI.
# This mirrors the existing ci-cmd profile.
integration-test-compose:
  stage: integration-test
  image: quay.io/ukhomeofficedigital/ileap-java17-mvn:1.3
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
    FDP_APP_KAFKA_TOPIC_SUFFIX: "0"
    ADAPTOR_NAME: "dvla"
    SPRING_PROFILES_ACTIVE: "docker"
  cache:
    key: "$CI_COMMIT_REF_SLUG-maven"
    paths:
      - .m2/repository
  before_script:
    - docker info
  script:
    - ITEST_START=$(date +%s)
    # Existing approach: docker-compose-maven-plugin handles compose up/down
    - ./mvnw -B verify -pl cmd-adaptor-dvla-integration-tests -P ci-cmd
    - ITEST_END=$(date +%s)
    - echo "Integration test (compose) duration $(( ITEST_END - ITEST_START ))s" | tee itest-compose-metrics.txt
  artifacts:
    reports:
      junit: cmd-adaptor-dvla-integration-tests/target/failsafe-reports/TEST-*.xml
    paths:
      - itest-compose-metrics.txt
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  when: manual   # Manual trigger — run for T4.3 comparison
