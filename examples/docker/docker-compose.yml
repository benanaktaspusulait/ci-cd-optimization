# docker-compose.yml — FDP Integration Test Infrastructure
#
# Based on the real FDP docker-compose (RepoSync-controlled).
# This shows the INFRASTRUCTURE services only (not the FDP application services).
# Application services (aggregate-*, command-adaptor) are excluded — they would
# be built from source or pulled from the internal registry.
#
# Story 4 (T4.1–T4.2) will classify which of these are:
#   - Required for CI integration tests
#   - Useful for local debugging only
#   - Candidates for Testcontainers replacement (Story 3)
#
# Image versions pinned to match production MSK (3.5.1 = cp-kafka 7.5.5).
# Reference: ADR-0003, Story 4

services:

  # ── Zookeeper (Kafka dependency) ─────────────────────────────────────────
  zookeeper:
    # PM-71719: MSK deployed 3.5.1 equates to cp-kafka 7.5.5
    image: confluentinc/cp-zookeeper:7.5.5
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "2181:2181"
    platform: linux/amd64
    restart: always

  # ── Kafka ────────────────────────────────────────────────────────────────
  kafka:
    # PM-71719: MSK deployed 3.5.1 equates to cp-kafka 7.5.5
    image: confluentinc/cp-kafka:7.5.5
    container_name: kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "9092"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    platform: linux/amd64
    restart: always

  # ── Schema Registry ──────────────────────────────────────────────────────
  schema-registry:
    # PM-71719: MSK deployed 3.5.1 equates to cp-kafka 7.5.5
    image: confluentinc/cp-schema-registry:7.5.5
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_SSL_ENABLED_PROTOCOLS: PLAINTEXT
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 3
    platform: linux/amd64
    restart: always

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:5.0.6
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "6379:6379"
    platform: linux/amd64
    restart: always

  # ── LocalStack (AWS IAM emulation) ──────────────────────────────────────
  localstack:
    image: localstack/localstack:0.12.18
    container_name: localstack
    environment:
      LOCALSTACK_DEBUG: 1
      LOCALSTACK_SERVICES: "iam"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4566/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:4566:4566"
    platform: linux/amd64
    restart: always

  # ── Jaeger (OpenTelemetry tracing) ──────────────────────────────────────
  # Used for local trace inspection. Likely NOT needed for CI integration tests.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: jaeger
    hostname: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 14269"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "16686:16686"   # Jaeger UI
    platform: linux/amd64
    restart: always

  # ── Kafdrop (Kafka UI) ──────────────────────────────────────────────────
  # Local debugging only — NOT needed for CI integration tests.
  kafdrop:
    image: obsidiandynamics/kafdrop:3.30.0
    container_name: kafdrop
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      CMD_ARGS: "--message.format=AVRO --schemaregistry.connect=http://schema-registry:8081 --topic.createEnabled=false --topic.deleteEnabled=false"
      KAFKA_BROKERCONNECT: kafka:29092
    ports:
      - "9000:9000"
    platform: linux/amd64
    restart: always
