# GitLab CI/CD Pipeline — Container & CI/CD Optimisation Pilot
#
# BASELINE TEMPLATE — fill in real values once T1.1 (pilot repo selection) is complete.
# This file is a starting point; adapt it to the pilot repository's existing pipeline structure.
# It expects the selected pilot repo to contain `pom.xml`, `mvnw`, `.mvn/`, and `src/`.
#
# References:
#   ADR-0004: BuildKit cache + layered multi-stage builds
#   ADR-0005: CI runner Docker execution mode
#   post-pilot (remote cache): Remote cache (platform/ETO prerequisite — see comments below)
#   docs/stories/tech-notes.md

---

# ─── Variables ────────────────────────────────────────────────────────────────
variables:
  # Replace with the pilot repository's actual registry path (set in T1.1)
  REGISTRY_IMAGE: "registry.example.com/fdp/pilot-service"   # TODO: update in T1.1
  DOCKER_BUILDKIT: "1"

  # Remote cache — requires platform/ETO registry namespace (post-pilot (remote cache)).
  # Comment out the CACHE_FROM/CACHE_TO lines until infra is provisioned.
  CACHE_IMAGE: "${REGISTRY_IMAGE}/cache"

  # Maven settings — injected via GitLab CI/CD variable (masked/protected).
  # Never hardcode credentials here. See SECURITY.md.
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

# ─── Stages ───────────────────────────────────────────────────────────────────
stages:
  - build
  - scan
  - test
  - integration-test
  - metrics
  - publish

# ─── Default ──────────────────────────────────────────────────────────────────
default:
  tags:
    # TODO: replace with the runner tag approved in T3.2 / ADR-0005.
    - docker-privileged-tbd

# ─── Build ────────────────────────────────────────────────────────────────────
build-image:
  stage: build
  image: docker:24-cli
  services:
    # Template default only: DinD needs a dedicated privileged runner.
    # Replace with socket mount or rootless mode if ADR-0005 selects that path.
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Record build start time for T1.3 / T2.4 baseline measurement.
    - BUILD_START=$(date +%s)

    - |
      # Remote cache (post-pilot (remote cache)): add the cache flags below after
      # platform/ETO provisions the registry cache namespace:
      #   --cache-from=type=registry,ref=${CACHE_IMAGE}:main
      #   --cache-from=type=registry,ref=${CACHE_IMAGE}:${CI_COMMIT_REF_SLUG}
      #   --cache-to=type=registry,ref=${CACHE_IMAGE}:${CI_COMMIT_REF_SLUG},mode=max
      docker buildx build \
        --file Dockerfile \
        --tag "${REGISTRY_IMAGE}:${CI_COMMIT_SHA}" \
        --tag "${REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}" \
        --push \
        .

    - BUILD_END=$(date +%s)
    - echo "Build duration $(( BUILD_END - BUILD_START ))s" | tee build-metrics.txt
    - docker pull "${REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
    - docker image inspect "${REGISTRY_IMAGE}:${CI_COMMIT_SHA}" --format '{{.Size}}' | tee -a build-metrics.txt
  artifacts:
    paths:
      - build-metrics.txt   # Capture for T1.3 / T2.4 before/after comparison
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── Security scan (Trivy) ────────────────────────────────────────────────────
# Scans the built image for known vulnerabilities.
# Non-blocking during pilot (--exit-code 0) — reports only.
# Promote to blocking (--exit-code 1) once baseline is understood.
# Reference: SECURITY.md
#
container-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.52.2
    entrypoint: [""]
  variables:
    FULL_IMAGE_NAME: "${REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format table "$FULL_IMAGE_NAME"
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format json --output trivy-report.json "$FULL_IMAGE_NAME"
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true   # Non-blocking during pilot; remove once gates are agreed

# ─── Unit tests ───────────────────────────────────────────────────────────────
unit-test:
  stage: test
  image: eclipse-temurin:17-jdk   # TODO: align with post-pilot (base image) base image once provisioned
  cache:
    key: "$CI_COMMIT_REF_SLUG-maven"
    paths:
      - .m2/repository
  script:
    - ./mvnw -B test -Dskip.integration.tests=true
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── Integration tests ────────────────────────────────────────────────────────
#
# T3.2 decision: Docker Compose (current) vs Testcontainers (pilot candidate).
# ADR-0005 governs the Docker mode available to integration tests in CI.
# Until T3.2 is complete, Docker Compose is used.
#
integration-test:
  stage: integration-test
  # docker:24-cli provides Docker CLI + Compose; Java is installed below for `./mvnw`.
  # Prefer a prebuilt, approved Java+Docker CI image once platform/ETO provides one.
  image: docker:24-cli
  services:
    # Template default only: DinD needs a dedicated privileged runner.
    # Replace with socket mount or rootless mode if ADR-0005 selects that path.
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache openjdk17-jdk
    - docker info
  script:
    - ITEST_START=$(date +%s)
    - docker compose --profile integration -f docker-compose.yml up -d --wait
    - ./mvnw -B verify -Dskip.unit.tests=true
    - ITEST_END=$(date +%s)
    - echo "Integration test startup + run duration $(( ITEST_END - ITEST_START ))s" | tee itest-metrics.txt
  after_script:
    - docker compose --profile integration -f docker-compose.yml down -v
  artifacts:
    reports:
      junit: target/failsafe-reports/TEST-*.xml
    paths:
      - itest-metrics.txt   # Capture for T1.4 / T3.3 before/after comparison
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ─── Pipeline metrics (observability) ─────────────────────────────────────────
# Collects pipeline timing data after every run for trend analysis.
# Feeds into the metrics-template.md and enables regression detection.
# Reference: docs/stories/metrics-template.md
#
collect-metrics:
  stage: metrics
  image: alpine:3.19
  script:
    - |
      echo "{
        \"pipeline_id\": \"$CI_PIPELINE_ID\",
        \"commit\": \"$CI_COMMIT_SHORT_SHA\",
        \"branch\": \"$CI_COMMIT_REF_SLUG\",
        \"timestamp\": \"$(date -Iseconds)\",
        \"pipeline_url\": \"$CI_PIPELINE_URL\"
      }" > pipeline-metrics.json
    - cat pipeline-metrics.json
  artifacts:
    paths:
      - pipeline-metrics.json
      - build-metrics.txt
      - itest-metrics.txt
    expire_in: 90 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── Publish (main only) ──────────────────────────────────────────────────────
publish-image:
  stage: publish
  image: docker:24-cli
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Re-tag the SHA-tagged image with a mutable main alias.
    - docker pull "${REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
    - docker tag "${REGISTRY_IMAGE}:${CI_COMMIT_SHA}" "${REGISTRY_IMAGE}:main"
    - docker push "${REGISTRY_IMAGE}:main"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
